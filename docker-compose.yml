version: "3.9"

x-go-common: &go-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &common-env
    TZ: Africa/Nairobi
    DATABASE_URL: postgres://st_mary:James_Bond007%21@db:5432/st_marys_db?sslmode=disable&pool_max_conns=25
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}
    JWT_SECRET: ${JWT_SECRET:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}}
    JWT_ACCESS_TTL: 8h
    JWT_REFRESH_TTL: 168h
    TIME_ZONE: Africa/Nairobi
    REDIS_URL: redis://redis:6379/0
    USE_REDIS: "true"
    PORTAL_URL: ${PORTAL_URL:-http://localhost:5173}
    NOVA_URL: ${NOVA_URL:-http://localhost:5174}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
    MEDIA_ROOT: /app/media
    MEDIA_URL: /media/
    MPESA_PAYBILL: ${MPESA_PAYBILL:-247247}
    MPESA_ACCOUNT_PREFIX: ${MPESA_ACCOUNT_PREFIX:-137101}
    MPESA_SHARED_SECRET: ${MPESA_SHARED_SECRET:-}
    MPESA_ALLOWED_IPS: ${MPESA_ALLOWED_IPS:-}
    FINGERPRINT_ENCRYPTION_KEY: ${FINGERPRINT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    FINGERPRINT_ENCRYPTION_SALT: ${FINGERPRINT_ENCRYPTION_SALT:-stmarys-fp-salt}
    SCHOOL_NAME: "ACK St. Mary's School Kabete"
    EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
    DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@stmaryskabete.ac.ke}
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started
  volumes:
    - media_data:/app/media

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: st_marys_db
      POSTGRES_USER: st_mary
      POSTGRES_PASSWORD: "James_Bond007!"
      TZ: Africa/Nairobi
      PGTZ: Africa/Nairobi
    ports:
      - "5432:5432"
    volumes:
      - stmarys_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U st_mary -d st_marys_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  migrate:
    <<: *go-common
    build:
      context: .
      dockerfile: Dockerfile.migrate
    restart: "no"
    environment:
      <<: *common-env
      DB_URL: postgres://st_mary:James_Bond007%21@db:5432/st_marys_db?sslmode=disable
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  api-gateway:
    <<: *go-common
    command: ["/app/api"]
    environment:
      <<: *common-env
      SERVER_PORT: "8000"
      API_PORT: "8000"
      FINGERPRINT_SERVICE_URL: http://fingerprint-svc:8004
      FINGERPRINT_SERVICE_KEY: ${FINGERPRINT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:fingerprint}
      PAYMENT_SERVICE_URL: http://payment-svc:8002
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:payment}
      NOTIFICATION_SERVICE_URL: http://notification-svc:8003
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:notification}
      REPORT_SERVICE_URL: http://report-svc:8005
      REPORT_SERVICE_KEY: ${REPORT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:report}
      FINANCE_SERVICE_URL: http://finance-svc:8006
      FINANCE_SERVICE_KEY: ${FINANCE_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:finance}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/api/health/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - migrate
      - fingerprint-svc
      - payment-svc
      - notification-svc
      - report-svc
      - finance-svc

  payment-svc:
    <<: *go-common
    command: ["/app/payment-svc"]
    environment:
      <<: *common-env
      PAYMENT_PORT: "8002"
      PAYMENT_SERVICE_KEY: ${PAYMENT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:payment}
      NOTIFICATION_SERVICE_URL: http://notification-svc:8003
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:notification}
    expose:
      - "8002"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  notification-svc:
    <<: *go-common
    command: ["/app/notification-svc"]
    environment:
      <<: *common-env
      NOTIFICATION_PORT: "8003"
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:notification}
      SMS_BACKEND: ${SMS_BACKEND:-console}
      SMS_API_KEY: ${SMS_API_KEY:-}
      SMS_SENDER: ${SMS_SENDER:-STMARYS}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ACK St. Mary's School Kabete}
    expose:
      - "8003"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8003/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  fingerprint-svc:
    <<: *go-common
    command: ["/app/fingerprint-svc"]
    environment:
      <<: *common-env
      FINGERPRINT_PORT: "8004"
      FINGERPRINT_SERVICE_KEY: ${FINGERPRINT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:fingerprint}
      NOTIFICATION_SERVICE_URL: http://notification-svc:8003
      NOTIFICATION_SERVICE_KEY: ${NOTIFICATION_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:notification}
    expose:
      - "8004"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8004/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  report-svc:
    <<: *go-common
    command: ["/app/report-svc"]
    environment:
      <<: *common-env
      REPORT_PORT: "8005"
      REPORT_SERVICE_KEY: ${REPORT_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:report}
    expose:
      - "8005"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8005/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  finance-svc:
    <<: *go-common
    command: ["/app/finance-svc"]
    environment:
      <<: *common-env
      FINANCE_PORT: "8006"
      FINANCE_SERVICE_KEY: ${FINANCE_SERVICE_KEY:-${DJANGO_SECRET_KEY:-change-me-in-production-0123456789abcdef}:finance}
      # M-Pesa B2C (Daraja) — salary/payout disbursement. Empty by default;
      # /payroll-entries/{id}/disburse/ fails with a clear error until these
      # are filled in with real Safaricom credentials.
      DARAJA_ENV: ${DARAJA_ENV:-sandbox}
      DARAJA_CONSUMER_KEY: ${DARAJA_CONSUMER_KEY:-}
      DARAJA_CONSUMER_SECRET: ${DARAJA_CONSUMER_SECRET:-}
      DARAJA_INITIATOR_NAME: ${DARAJA_INITIATOR_NAME:-}
      DARAJA_INITIATOR_SHORTCODE: ${DARAJA_INITIATOR_SHORTCODE:-}
      DARAJA_INITIATOR_PASSWORD: ${DARAJA_INITIATOR_PASSWORD:-}
      DARAJA_CERTIFICATE_PATH: ${DARAJA_CERTIFICATE_PATH:-/app/certs/SandboxCertificate.cer}
      DARAJA_B2C_COMMAND_ID: ${DARAJA_B2C_COMMAND_ID:-SalaryPayment}
      DARAJA_B2C_RESULT_URL: ${DARAJA_B2C_RESULT_URL:-}
      DARAJA_B2C_TIMEOUT_URL: ${DARAJA_B2C_TIMEOUT_URL:-}
    expose:
      - "8006"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8006/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/var/www/media:ro
    depends_on:
      - api-gateway
      - fingerprint-svc

volumes:
  stmarys_pgdata:
  redis_data:
  media_data:
